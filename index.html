<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANYA — My Favorite Song</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #071a3d, #0b4f9c, #55b9ff);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            width: 380px;
            padding: 35px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cceaff;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .album {
            width: 180px;
            height: 180px;
            margin: auto;
            border-radius: 20px;
            background: linear-gradient(145deg, #75caff, #1765b5);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        .music-note {
            font-size: 70px;
        }

        .song {
            margin-top: 25px;
        }

        .song h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .song p {
            color: #cceaff;
            font-size: 15px;
        }

        .favorite {
            margin: 25px 0;
            padding: 12px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 13px;
            color: #dff3ff;
        }

        .play-button {
            border: none;
            background: white;
            color: #0752a0;
            padding: 13px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .play-button:hover {
            transform: scale(1.05);
            background: #dff3ff;
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #b8ddff;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">ANYA</div>

        <div class="subtitle">
            my little music corner ♫
        </div>

        <div class="album">
            <div class="music-note">♪</div>
        </div>

        <div class="song">
            <h2>Choose The Latter</h2>
            <p>Finn Wolfhard</p>
        </div>

        <div class="favorite">
            💙 MY FAVORITE SONG
        </div>

        <button class="play-button">
            ▶ Play Song
        </button>

        <div class="footer">
            made with blue & music
        </div>

    </div>

</body>
</html>
