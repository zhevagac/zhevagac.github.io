<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ANYA — Favorite Song</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #06152f,
                #0a3d78,
                #168be0,
                #76d5ff
            );

            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* MUSIC CARD */

        .card {
            width: 390px;
            padding: 35px;
            border-radius: 28px;

            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.3);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            backdrop-filter: blur(18px);

            text-align: center;
        }

        /* TITLE */

        .logo {
            font-size: 45px;
            font-weight: 800;
            letter-spacing: 10px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #c9ecff;
            margin-bottom: 30px;
        }

        /* ALBUM */

        .album {
            width: 190px;
            height: 190px;

            margin: auto;

            border-radius: 22px;

            background: linear-gradient(
                145deg,
                #83d8ff,
                #0d5ca8
            );

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.35);
        }

        .music-note {
            font-size: 75px;
        }

        /* SONG INFORMATION */

        .song {
            margin-top: 25px;
        }

        .song h2 {
            font-size: 24px;
            margin-bottom: 7px;
        }

        .song p {
            font-size: 15px;
            color: #c9ecff;
        }

        /* FAVORITE LABEL */

        .favorite {
            margin: 24px 0;

            padding: 12px;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.1);

            color: #e4f7ff;

            font-size: 13px;
            letter-spacing: 1px;
        }

        /* BUTTON */

        .play-button {
            display: inline-block;

            text-decoration: none;

            background: white;
            color: #0752a0;

            padding: 14px 30px;

            border-radius: 30px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .play-button:hover {
            transform: scale(1.07);

            background: #e1f5ff;

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.3);
        }

        /* FOOTER */

        .footer {
            margin-top: 25px;

            font-size: 11px;

            color: #b8e5ff;
        }
    </style>
</head>


<body>

    <div class="card">

        <!-- NAME -->

        <div class="logo">
            ANYA
        </div>

        <div class="subtitle">
            my little music corner ♫
        </div>


        <!-- ALBUM -->

        <div class="album">
            <div class="music-note">
                ♪
            </div>
        </div>


        <!-- SONG -->

        <div class="song">

            <h2>
                Choose The Latter
            </h2>

            <p>
                Finn Wolfhard
            </p>

        </div>


        <!-- FAVORITE -->

        <div class="favorite">
            💙 MY FAVORITE SONG
        </div>


        <!-- YOUTUBE BUTTON -->

        <a
            href="https://youtu.be/2aQPVevcqHc?si=2GN4tlHPJQ-x_Sn9"
            target="_blank"
            rel="noopener noreferrer"
            class="play-button"
        >
            ▶ Play Song
        </a>


        <!-- FOOTER -->

        <div class="footer">
            made with blue & music
        </div>

    </div>

</body>
</html>
