<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ANYA — Ocean Music</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(circle at 20% 20%, #258edb 0%, transparent 30%),
                radial-gradient(circle at 80% 80%, #1261ad 0%, transparent 35%),
                linear-gradient(135deg, #03152f, #07589b, #159bd3);

            color: white;

            overflow-x: hidden;
        }


        /* =========================
           OCEAN DECORATIONS
        ========================= */

        .bubble {
            position: fixed;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,0.25);

            animation: float 6s infinite ease-in-out;

            pointer-events: none;
        }

        .bubble.one {
            width: 25px;
            height: 25px;

            left: 10%;
            bottom: 15%;
        }

        .bubble.two {
            width: 12px;
            height: 12px;

            right: 15%;
            bottom: 30%;

            animation-delay: 2s;
        }

        .bubble.three {
            width: 40px;
            height: 40px;

            right: 8%;
            top: 15%;

            animation-delay: 1s;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            width: min(900px, 90%);

            margin: auto;

            padding: 60px 0;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            text-align: center;

            margin-bottom: 45px;
        }

        .logo {

            font-size: 55px;

            font-weight: 900;

            letter-spacing: 14px;

            text-shadow:
                0 5px 20px rgba(0,0,0,0.3);
        }

        .subtitle {

            margin-top: 10px;

            color: #c9f1ff;

            font-size: 14px;

            letter-spacing: 2px;
        }


        /* =========================
           OCEAN QUOTE
        ========================= */

        .quote {

            text-align: center;

            margin: 30px auto 45px;

            max-width: 650px;

            font-family: Georgia, serif;

            font-size: 21px;

            font-style: italic;

            line-height: 1.6;

            color: #e5f8ff;
        }

        .quote span {

            display: block;

            margin-top: 8px;

            font-family: Arial, sans-serif;

            font-size: 11px;

            font-style: normal;

            letter-spacing: 2px;

            color: #9edcff;
        }


        /* =========================
           MUSIC CARD
        ========================= */

        .music-card {

            padding: 35px;

            border-radius: 30px;

            background: rgba(255,255,255,0.12);

            border: 1px solid rgba(255,255,255,0.25);

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.3);

            text-align: center;
        }


        /* =========================
           ALBUM
        ========================= */

        .album {

            width: 190px;
            height: 190px;

            margin: auto;

            border-radius: 25px;

            background:
                linear-gradient(
                    145deg,
                    #8ee4ff,
                    #0963aa
                );

            display: flex;

            justify-content: center;

            align-items: center;

            box-shadow:
                0 15px 35px rgba(0,0,0,0.3);
        }

        .music-note {

            font-size: 75px;

            text-shadow:
                0 5px 15px rgba(0,0,0,0.2);
        }


        /* =========================
           SONG
        ========================= */

        .song {

            margin-top: 25px;
        }

        .song h2 {

            font-size: 25px;

            margin-bottom: 8px;
        }

        .song p {

            color: #bceaff;

            font-size: 15px;
        }


        /* =========================
           BUTTON
        ========================= */

        .play-button {

            margin-top: 25px;

            padding: 14px 32px;

            border: none;

            border-radius: 30px;

            background: white;

            color: #07549a;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .play-button:hover {

            transform: scale(1.07);

            background: #ddf6ff;
        }


        /* =========================
           VIDEO SECTION
        ========================= */

        #video-section {

            display: none;

            margin-top: 35px;

            animation: appear 0.5s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .video-container {

            position: relative;

            width: 100%;

            padding-bottom: 56.25%;

            height: 0;

            overflow: hidden;

            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.4);
        }

        .video-container iframe {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;
        }


        /* =========================
           SECOND QUOTE
        ========================= */

        .ocean-quote {

            margin-top: 35px;

            text-align: center;

            font-family: Georgia, serif;

            font-style: italic;

            font-size: 18px;

            color: #d8f5ff;

            line-height: 1.6;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            text-align: center;

            margin-top: 50px;

            font-size: 11px;

            color: #9bdcff;

            letter-spacing: 1px;
        }

    </style>
</head>


<body>

    <!-- BUBBLES -->

    <div class="bubble one"></div>
    <div class="bubble two"></div>
    <div class="bubble three"></div>


    <div class="container">


        <!-- HEADER -->

        <header>

            <div class="logo">
                ANYA
            </div>

            <div class="subtitle">
                A LITTLE CORNER OF MUSIC & OCEAN
            </div>

        </header>


        <!-- OCEAN QUOTE -->

        <div class="quote">

            “The sea, once it casts its spell,
            holds one in its net of wonder forever.”

            <span>— Jacques Yves Cousteau</span>

        </div>


        <!-- MUSIC CARD -->

        <div class="music-card">


            <div class="album">

                <div class="music-note">
                    ♪
                </div>

            </div>


            <div class="song">

                <h2>
                    Choose The Latter
                </h2>

                <p>
                    Finn Wolfhard
                </p>

            </div>


            <button
                class="play-button"
                onclick="showVideo()"
            >
                ▶ Play Song
            </button>


            <!-- VIDEO -->

            <div id="video-section">

                <div class="video-container">

                    <iframe
                        id="youtube-video"
                        src=""
                        allow="autoplay; encrypted-media"
                        allowfullscreen>
                    </iframe>

                </div>


                <div class="ocean-quote">

                    “The ocean is a poem without words,
                    written in waves.”

                </div>

            </div>

        </div>


        <footer>

            🌊 made with music, memories & a little bit of ocean

        </footer>


    </div>


    <script>

        function showVideo() {

            const videoSection =
                document.getElementById("video-section");

            const video =
                document.getElementById("youtube-video");


            video.src =
                "https://www.youtube.com/embed/2aQPVevcqHc?autoplay=1";


            videoSection.style.display = "block";


            videoSection.scrollIntoView({
                behavior: "smooth"
            });

        }

    </script>

</body>
</html>
